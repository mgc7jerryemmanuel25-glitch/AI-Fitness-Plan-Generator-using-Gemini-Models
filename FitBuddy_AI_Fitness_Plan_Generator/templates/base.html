<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "FitBuddy" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
<header class="site-header">
    <div class="brand"><span class="brand-icon">💪</span>FitBuddy</div>
    <nav><a href="/">Home</a><a href="/docs">API Docs</a></nav>
</header>
<main class="page-shell">
    {% block content %}{% endblock %}
</main>
<footer class="site-footer">
    <p>FitBuddy provides general fitness and wellness information. It is not medical advice.</p>
</footer>
<script src="{{ url_for('static', path='js/app.js') }}"></script>
</body>
</html>
